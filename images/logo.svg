<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" fill="none">
  <defs>
    <linearGradient id="stem-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a7c3f"/>
      <stop offset="100%" stop-color="#2d5a27"/>
    </linearGradient>
    <linearGradient id="petal-pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="petal-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="petal-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6fa85b"/>
      <stop offset="100%" stop-color="#4a7c3f"/>
    </linearGradient>
  </defs>

  <g transform="translate(55, 60)">
    <!-- Main stem -->
    <path d="M0 -5 L0 45" stroke="url(#stem-grad)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Branch left -->
    <path d="M0 20 C-8 15 -18 8 -22 2" stroke="url(#stem-grad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Branch right -->
    <path d="M0 28 C10 22 18 16 22 10" stroke="url(#stem-grad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Large flower (main, pink) -->
    <g transform="translate(0, -18)">
      <ellipse cx="0" cy="-12" rx="7" ry="12" fill="url(#petal-pink)" transform="rotate(0)" opacity="0.9"/>
      <ellipse cx="0" cy="-12" rx="7" ry="12" fill="url(#petal-pink)" transform="rotate(60)" opacity="0.85"/>
      <ellipse cx="0" cy="-12" rx="7" ry="12" fill="url(#petal-pink)" transform="rotate(120)" opacity="0.9"/>
      <ellipse cx="0" cy="-12" rx="7" ry="12" fill="url(#petal-pink)" transform="rotate(180)" opacity="0.85"/>
      <ellipse cx="0" cy="-12" rx="7" ry="12" fill="url(#petal-pink)" transform="rotate(240)" opacity="0.9"/>
      <ellipse cx="0" cy="-12" rx="7" ry="12" fill="url(#petal-pink)" transform="rotate(300)" opacity="0.85"/>
      <circle cx="0" cy="0" r="6" fill="#fbbf24"/>
      <circle cx="-1.5" cy="-1.5" r="1" fill="#f59e0b" opacity="0.6"/>
      <circle cx="2" cy="1" r="1.2" fill="#f59e0b" opacity="0.5"/>
      <circle cx="0" cy="2" r="0.8" fill="#f59e0b" opacity="0.4"/>
    </g>

    <!-- Small flower left (purple) -->
    <g transform="translate(-22, -2)">
      <ellipse cx="0" cy="-8" rx="5" ry="8" fill="url(#petal-purple)" transform="rotate(0)" opacity="0.85"/>
      <ellipse cx="0" cy="-8" rx="5" ry="8" fill="url(#petal-purple)" transform="rotate(72)" opacity="0.8"/>
      <ellipse cx="0" cy="-8" rx="5" ry="8" fill="url(#petal-purple)" transform="rotate(144)" opacity="0.85"/>
      <ellipse cx="0" cy="-8" rx="5" ry="8" fill="url(#petal-purple)" transform="rotate(216)" opacity="0.8"/>
      <ellipse cx="0" cy="-8" rx="5" ry="8" fill="url(#petal-purple)" transform="rotate(288)" opacity="0.85"/>
      <circle cx="0" cy="0" r="4" fill="#fde68a"/>
      <circle cx="0" cy="0" r="2" fill="#fbbf24" opacity="0.7"/>
    </g>

    <!-- Small flower right (orange) -->
    <g transform="translate(22, 6)">
      <ellipse cx="0" cy="-7" rx="4.5" ry="7" fill="url(#petal-orange)" transform="rotate(0)" opacity="0.85"/>
      <ellipse cx="0" cy="-7" rx="4.5" ry="7" fill="url(#petal-orange)" transform="rotate(72)" opacity="0.8"/>
      <ellipse cx="0" cy="-7" rx="4.5" ry="7" fill="url(#petal-orange)" transform="rotate(144)" opacity="0.85"/>
      <ellipse cx="0" cy="-7" rx="4.5" ry="7" fill="url(#petal-orange)" transform="rotate(216)" opacity="0.8"/>
      <ellipse cx="0" cy="-7" rx="4.5" ry="7" fill="url(#petal-orange)" transform="rotate(288)" opacity="0.85"/>
      <circle cx="0" cy="0" r="3.5" fill="#fde68a"/>
      <circle cx="0" cy="0" r="1.8" fill="#fbbf24" opacity="0.7"/>
    </g>

    <!-- Leaves -->
    <path d="M-5 30 C-20 22 -28 12 -24 5 C-20 -2 -8 8 -2 18 Z" fill="url(#leaf-grad)" opacity="0.9"/>
    <path d="M-4 28 C-14 22 -18 16 -16 12" stroke="#e8f5e3" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>

    <path d="M5 35 C22 28 30 18 26 10 C22 2 10 12 4 24 Z" fill="url(#leaf-grad)" opacity="0.85"/>
    <path d="M6 32 C16 26 20 20 18 15" stroke="#e8f5e3" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- Small leaf bud -->
    <path d="M-8 40 C-14 36 -16 30 -12 28 C-8 26 -6 32 -6 38 Z" fill="#6fa85b" opacity="0.7"/>

    <!-- Soil/earth line -->
    <path d="M-20 48 C-10 46 10 46 20 48" stroke="#8B6914" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <circle cx="-8" cy="49" r="1.5" fill="#8B6914" opacity="0.25"/>
    <circle cx="5" cy="50" r="1" fill="#8B6914" opacity="0.2"/>
    <circle cx="12" cy="48.5" r="1.2" fill="#8B6914" opacity="0.2"/>
  </g>

  <!-- Text: Gärtnerei -->
  <text x="120" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" fill="#2d5a27" letter-spacing="4">GÄRTNEREI</text>

  <!-- Decorative line with tiny flower accents -->
  <line x1="120" y1="56" x2="330" y2="56" stroke="#6fa85b" stroke-width="1.5" opacity="0.5"/>
  <circle cx="120" cy="56" r="2.5" fill="#f472b6" opacity="0.6"/>
  <circle cx="330" cy="56" r="2.5" fill="#fb923c" opacity="0.6"/>

  <!-- Text: EBER -->
  <text x="120" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#2d5a27" letter-spacing="6">EBER</text>

  <!-- Tagline -->
  <text x="120" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#6b4226" letter-spacing="1.5">von da, wo es wächst</text>
</svg>
