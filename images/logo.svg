<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 130" fill="none">
  <defs>
    <!-- Flower gradients -->
    <radialGradient id="rose-center" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffe0ec"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </radialGradient>
    <radialGradient id="rose-outer" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fb7bb8"/>
      <stop offset="100%" stop-color="#e11d79"/>
    </radialGradient>
    <radialGradient id="tulip-grad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fca5d0"/>
      <stop offset="100%" stop-color="#e8408a"/>
    </radialGradient>
    <radialGradient id="daisy-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <radialGradient id="violet-grad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <radialGradient id="sunflower-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="80%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <linearGradient id="stem-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="leaf-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="leaf-g2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <!-- Subtle glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0.5" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- ===== FLORAL BOUQUET ===== -->
  <g transform="translate(58, 65)" filter="url(#soft-shadow)">

    <!-- Main stems -->
    <path d="M0 0 L0 50" stroke="url(#stem-g)" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 15 C-12 8 -25 -2 -30 -10" stroke="url(#stem-g)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M0 20 C14 12 26 2 30 -8" stroke="url(#stem-g)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M0 8 C-6 2 -14 -8 -12 -18" stroke="url(#stem-g)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M0 10 C8 4 16 -4 18 -14" stroke="url(#stem-g)" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Large leaf left -->
    <path d="M-4 32 C-22 24 -32 12 -26 4 C-20 -4 -8 10 -2 24 Z" fill="url(#leaf-g)" opacity="0.92"/>
    <path d="M-4 30 C-16 22 -22 14 -20 8" stroke="#dcfce7" stroke-width="0.8" fill="none" opacity="0.7"/>
    <path d="M-6 28 C-12 24 -16 20 -18 14" stroke="#dcfce7" stroke-width="0.5" fill="none" opacity="0.4"/>

    <!-- Large leaf right -->
    <path d="M4 38 C24 30 34 18 28 8 C22 -2 8 14 4 28 Z" fill="url(#leaf-g2)" opacity="0.88"/>
    <path d="M6 34 C18 26 24 18 22 12" stroke="#dcfce7" stroke-width="0.8" fill="none" opacity="0.7"/>

    <!-- Small leaf bud -->
    <path d="M-8 44 C-16 38 -18 30 -12 28 C-6 26 -4 34 -6 42 Z" fill="#4ade80" opacity="0.7"/>

    <!-- ---- Sunflower (center, main) ---- -->
    <g transform="translate(0, -24)" filter="url(#glow)">
      <!-- Outer petals -->
      <g opacity="0.9">
        <ellipse cx="0" cy="-14" rx="4.5" ry="13" fill="#fbbf24" transform="rotate(0)"/>
        <ellipse cx="0" cy="-14" rx="4.5" ry="13" fill="#f59e0b" transform="rotate(30)"/>
        <ellipse cx="0" cy="-14" rx="4.5" ry="13" fill="#fbbf24" transform="rotate(60)"/>
        <ellipse cx="0" cy="-14" rx="4.5" ry="13" fill="#f59e0b" transform="rotate(90)"/>
        <ellipse cx="0" cy="-14" rx="4.5" ry="13" fill="#fbbf24" transform="rotate(120)"/>
        <ellipse cx="0" cy="-14" rx="4.5" ry="13" fill="#f59e0b" transform="rotate(150)"/>
        <ellipse cx="0" cy="-14" rx="4.5" ry="13" fill="#fbbf24" transform="rotate(180)"/>
        <ellipse cx="0" cy="-14" rx="4.5" ry="13" fill="#f59e0b" transform="rotate(210)"/>
        <ellipse cx="0" cy="-14" rx="4.5" ry="13" fill="#fbbf24" transform="rotate(240)"/>
        <ellipse cx="0" cy="-14" rx="4.5" ry="13" fill="#f59e0b" transform="rotate(270)"/>
        <ellipse cx="0" cy="-14" rx="4.5" ry="13" fill="#fbbf24" transform="rotate(300)"/>
        <ellipse cx="0" cy="-14" rx="4.5" ry="13" fill="#f59e0b" transform="rotate(330)"/>
      </g>
      <!-- Inner petals -->
      <g opacity="0.85">
        <ellipse cx="0" cy="-10" rx="3.5" ry="9" fill="#fde68a" transform="rotate(15)"/>
        <ellipse cx="0" cy="-10" rx="3.5" ry="9" fill="#fcd34d" transform="rotate(45)"/>
        <ellipse cx="0" cy="-10" rx="3.5" ry="9" fill="#fde68a" transform="rotate(75)"/>
        <ellipse cx="0" cy="-10" rx="3.5" ry="9" fill="#fcd34d" transform="rotate(105)"/>
        <ellipse cx="0" cy="-10" rx="3.5" ry="9" fill="#fde68a" transform="rotate(135)"/>
        <ellipse cx="0" cy="-10" rx="3.5" ry="9" fill="#fcd34d" transform="rotate(165)"/>
        <ellipse cx="0" cy="-10" rx="3.5" ry="9" fill="#fde68a" transform="rotate(195)"/>
        <ellipse cx="0" cy="-10" rx="3.5" ry="9" fill="#fcd34d" transform="rotate(225)"/>
        <ellipse cx="0" cy="-10" rx="3.5" ry="9" fill="#fde68a" transform="rotate(255)"/>
        <ellipse cx="0" cy="-10" rx="3.5" ry="9" fill="#fcd34d" transform="rotate(285)"/>
        <ellipse cx="0" cy="-10" rx="3.5" ry="9" fill="#fde68a" transform="rotate(315)"/>
        <ellipse cx="0" cy="-10" rx="3.5" ry="9" fill="#fcd34d" transform="rotate(345)"/>
      </g>
      <!-- Center -->
      <circle cx="0" cy="0" r="7" fill="url(#sunflower-center)"/>
      <circle cx="-2" cy="-2" r="0.8" fill="#a16207" opacity="0.5"/>
      <circle cx="2" cy="-1" r="0.7" fill="#a16207" opacity="0.4"/>
      <circle cx="0" cy="2" r="0.9" fill="#a16207" opacity="0.5"/>
      <circle cx="-1" cy="1" r="0.6" fill="#a16207" opacity="0.3"/>
      <circle cx="3" cy="2" r="0.7" fill="#a16207" opacity="0.4"/>
    </g>

    <!-- ---- Rose (left) ---- -->
    <g transform="translate(-30, -14)" filter="url(#glow)">
      <!-- Outer petals -->
      <ellipse cx="0" cy="-9" rx="5.5" ry="9" fill="url(#rose-outer)" transform="rotate(0)" opacity="0.8"/>
      <ellipse cx="0" cy="-9" rx="5.5" ry="9" fill="url(#rose-outer)" transform="rotate(72)" opacity="0.75"/>
      <ellipse cx="0" cy="-9" rx="5.5" ry="9" fill="url(#rose-outer)" transform="rotate(144)" opacity="0.8"/>
      <ellipse cx="0" cy="-9" rx="5.5" ry="9" fill="url(#rose-outer)" transform="rotate(216)" opacity="0.75"/>
      <ellipse cx="0" cy="-9" rx="5.5" ry="9" fill="url(#rose-outer)" transform="rotate(288)" opacity="0.8"/>
      <!-- Inner petals (rose swirl) -->
      <ellipse cx="0" cy="-6" rx="3.8" ry="6" fill="url(#rose-center)" transform="rotate(36)" opacity="0.9"/>
      <ellipse cx="0" cy="-6" rx="3.8" ry="6" fill="url(#rose-center)" transform="rotate(108)" opacity="0.85"/>
      <ellipse cx="0" cy="-6" rx="3.8" ry="6" fill="url(#rose-center)" transform="rotate(180)" opacity="0.9"/>
      <ellipse cx="0" cy="-6" rx="3.8" ry="6" fill="url(#rose-center)" transform="rotate(252)" opacity="0.85"/>
      <ellipse cx="0" cy="-6" rx="3.8" ry="6" fill="url(#rose-center)" transform="rotate(324)" opacity="0.9"/>
      <!-- Center rosette -->
      <circle cx="0" cy="0" r="3.5" fill="#fce7f3"/>
      <path d="M-1 -1 C-1 -3 1 -3 1 -1 C3 -1 3 1 1 1 C1 3 -1 3 -1 1 C-3 1 -3 -1 -1 -1 Z" fill="#f9a8d4" opacity="0.7"/>
    </g>

    <!-- ---- Violet (upper left) ---- -->
    <g transform="translate(-14, -38)" filter="url(#glow)">
      <ellipse cx="0" cy="-7" rx="4" ry="7.5" fill="url(#violet-grad)" transform="rotate(0)" opacity="0.85"/>
      <ellipse cx="0" cy="-7" rx="4" ry="7.5" fill="url(#violet-grad)" transform="rotate(72)" opacity="0.8"/>
      <ellipse cx="0" cy="-7" rx="4" ry="7.5" fill="url(#violet-grad)" transform="rotate(144)" opacity="0.85"/>
      <ellipse cx="0" cy="-7" rx="4" ry="7.5" fill="url(#violet-grad)" transform="rotate(216)" opacity="0.8"/>
      <ellipse cx="0" cy="-7" rx="4" ry="7.5" fill="url(#violet-grad)" transform="rotate(288)" opacity="0.85"/>
      <circle cx="0" cy="0" r="3" fill="#fef9c3"/>
      <circle cx="0" cy="0" r="1.5" fill="#fbbf24" opacity="0.8"/>
    </g>

    <!-- ---- Daisy (right) ---- -->
    <g transform="translate(28, -16)" filter="url(#glow)">
      <!-- White petals -->
      <ellipse cx="0" cy="-9" rx="3.5" ry="9" fill="#ffffff" stroke="#e5e7eb" stroke-width="0.3" transform="rotate(0)" opacity="0.95"/>
      <ellipse cx="0" cy="-9" rx="3.5" ry="9" fill="#fefefe" stroke="#e5e7eb" stroke-width="0.3" transform="rotate(45)" opacity="0.9"/>
      <ellipse cx="0" cy="-9" rx="3.5" ry="9" fill="#ffffff" stroke="#e5e7eb" stroke-width="0.3" transform="rotate(90)" opacity="0.95"/>
      <ellipse cx="0" cy="-9" rx="3.5" ry="9" fill="#fefefe" stroke="#e5e7eb" stroke-width="0.3" transform="rotate(135)" opacity="0.9"/>
      <ellipse cx="0" cy="-9" rx="3.5" ry="9" fill="#ffffff" stroke="#e5e7eb" stroke-width="0.3" transform="rotate(180)" opacity="0.95"/>
      <ellipse cx="0" cy="-9" rx="3.5" ry="9" fill="#fefefe" stroke="#e5e7eb" stroke-width="0.3" transform="rotate(225)" opacity="0.9"/>
      <ellipse cx="0" cy="-9" rx="3.5" ry="9" fill="#ffffff" stroke="#e5e7eb" stroke-width="0.3" transform="rotate(270)" opacity="0.95"/>
      <ellipse cx="0" cy="-9" rx="3.5" ry="9" fill="#fefefe" stroke="#e5e7eb" stroke-width="0.3" transform="rotate(315)" opacity="0.9"/>
      <!-- Yellow center -->
      <circle cx="0" cy="0" r="5" fill="url(#daisy-center)"/>
      <circle cx="-1" cy="-1" r="0.6" fill="#d97706" opacity="0.4"/>
      <circle cx="1.5" cy="0.5" r="0.5" fill="#d97706" opacity="0.3"/>
    </g>

    <!-- ---- Tulip bud (upper right) ---- -->
    <g transform="translate(18, -36)">
      <path d="M-3 4 C-6 -2 -5 -10 0 -14 C5 -10 6 -2 3 4 Z" fill="url(#tulip-grad)" opacity="0.9"/>
      <path d="M-1 4 C-3 -1 -2 -8 0 -12 C2 -8 3 -1 1 4 Z" fill="#fce7f3" opacity="0.5"/>
      <path d="M0 4 C-1 -1 0 -6 0 -10" stroke="#fda4af" stroke-width="0.5" fill="none" opacity="0.5"/>
    </g>

    <!-- Small decorative buds -->
    <circle cx="-20" cy="-30" r="2" fill="#c084fc" opacity="0.4"/>
    <circle cx="35" cy="-28" r="1.8" fill="#f9a8d4" opacity="0.35"/>

    <!-- Earth/base -->
    <ellipse cx="0" cy="52" rx="22" ry="3" fill="#92400e" opacity="0.12"/>
  </g>

  <!-- ===== TYPOGRAPHY ===== -->
  <g filter="url(#soft-shadow)">
    <!-- GÄRTNEREI -->
    <text x="128" y="46" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" font-size="24" font-weight="400" fill="url(#text-grad)" letter-spacing="5" opacity="0.95">GÄRTNEREI</text>

    <!-- Decorative flourish line -->
    <line x1="128" y1="54" x2="350" y2="54" stroke="#4ade80" stroke-width="1" opacity="0.4"/>
    <circle cx="128" cy="54" r="2" fill="#f472b6" opacity="0.5"/>
    <circle cx="239" cy="54" r="1.5" fill="#fbbf24" opacity="0.5"/>
    <circle cx="350" cy="54" r="2" fill="#8b5cf6" opacity="0.5"/>

    <!-- EBER -->
    <text x="128" y="92" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" font-size="46" font-weight="700" fill="url(#text-grad)" letter-spacing="8">EBER</text>

    <!-- Tagline with subtle styling -->
    <text x="130" y="112" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" font-size="12.5" font-style="italic" fill="#78350f" letter-spacing="1.8" opacity="0.75">von da, wo es wächst</text>

    <!-- Small leaf accent after tagline -->
    <path d="M310 108 C316 104 320 106 318 110 C316 114 310 112 310 108 Z" fill="#4ade80" opacity="0.5"/>
  </g>
</svg>