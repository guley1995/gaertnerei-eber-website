<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 110" fill="none">
  <defs>
    <!-- Blatt-Gradienten -->
    <linearGradient id="leaf1" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#388e3c"/>
    </linearGradient>
    <!-- Rose/Rot -->
    <radialGradient id="rose" cx="0.4" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#ef5350"/>
      <stop offset="60%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </radialGradient>
    <!-- Lila -->
    <radialGradient id="violet" cx="0.4" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#ce93d8"/>
      <stop offset="50%" stop-color="#ab47bc"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </radialGradient>
    <!-- Gelb/Sonnenblume -->
    <radialGradient id="sunfl" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#ffee58"/>
      <stop offset="60%" stop-color="#fdd835"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </radialGradient>
    <!-- Orange -->
    <radialGradient id="orange" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="60%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>
    <!-- Stiel -->
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>

  <!-- ===== BLUMEN-BOUQUET ===== -->
  <g transform="translate(48, 55)">

    <!-- === Stiele === -->
    <path d="M-4 14 C-6 22 -3 32 -2 42" stroke="url(#stem)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M4 14 C6 22 4 32 3 42" stroke="url(#stem)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M0 10 C0 20 0 30 0 42" stroke="url(#stem)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- === Blätter === -->
    <!-- Blatt links groß -->
    <path d="M-3 30 C-10 26 -22 22 -28 16 C-26 12 -18 14 -10 20 C-6 24 -3 28 -3 30Z" fill="url(#leaf1)" opacity="0.9"/>
    <path d="M-4 29 C-10 25 -18 21 -24 17" stroke="#81c784" stroke-width="0.6" fill="none" opacity="0.5"/>
    <!-- Blattadern -->
    <path d="M-8 26 C-10 24 -14 22 -16 20" stroke="#a5d6a7" stroke-width="0.4" fill="none" opacity="0.4"/>

    <!-- Blatt rechts groß -->
    <path d="M3 34 C10 30 22 26 28 20 C26 16 18 18 10 24 C6 28 3 32 3 34Z" fill="url(#leaf2)" opacity="0.9"/>
    <path d="M4 33 C10 29 18 25 24 21" stroke="#81c784" stroke-width="0.6" fill="none" opacity="0.5"/>
    <path d="M8 30 C10 28 14 26 16 24" stroke="#a5d6a7" stroke-width="0.4" fill="none" opacity="0.4"/>

    <!-- Kleines Blatt Mitte -->
    <path d="M1 22 C4 18 10 14 14 10 C12 8 8 10 4 14 C2 17 1 20 1 22Z" fill="#66bb6a" opacity="0.7"/>

    <!-- === BLÜTE 1: Große Rose (Mitte) === -->
    <g transform="translate(0, -6)">
      <!-- Äußere Blütenblätter -->
      <path d="M0 -20 C-5 -18 -10 -12 -9 -6 C-8 -1 -4 2 0 3 C4 2 8 -1 9 -6 C10 -12 5 -18 0 -20Z" fill="url(#rose)"/>
      <path d="M-8 -16 C-13 -12 -14 -5 -11 0 C-8 4 -3 5 0 3 C-2 1 -5 -2 -6 -6 C-7 -10 -6 -14 -8 -16Z" fill="#e53935" opacity="0.7"/>
      <path d="M8 -16 C13 -12 14 -5 11 0 C8 4 3 5 0 3 C2 1 5 -2 6 -6 C7 -10 6 -14 8 -16Z" fill="#c62828" opacity="0.6"/>
      <!-- Innere Spirale -->
      <path d="M0 -15 C-3 -13 -5 -9 -4 -5 C-3 -2 -1 0 0 0 C1 0 3 -2 4 -5 C5 -9 3 -13 0 -15Z" fill="#ef9a9a" opacity="0.55"/>
      <ellipse cx="0" cy="-8" rx="2" ry="3" fill="#ffcdd2" opacity="0.3"/>
    </g>

    <!-- === BLÜTE 2: Lila Blume (links oben) === -->
    <g transform="translate(-14, -4) rotate(-15)">
      <!-- 5 Blütenblätter -->
      <path d="M0 -15 C-2 -13 -4 -9 -3.5 -5 C-3 -2 -1 0 0 0 C1 0 3 -2 3.5 -5 C4 -9 2 -13 0 -15Z" fill="url(#violet)"/>
      <path d="M-4 -13 C-7 -10 -8 -5 -6 -1 C-4 2 -1 2 0 0 C-1 -2 -3 -4 -3.5 -7 C-3.5 -10 -3 -12 -4 -13Z" fill="#9c27b0" opacity="0.7"/>
      <path d="M4 -13 C7 -10 8 -5 6 -1 C4 2 1 2 0 0 C1 -2 3 -4 3.5 -7 C3.5 -10 3 -12 4 -13Z" fill="#7b1fa2" opacity="0.6"/>
      <!-- Zentrum -->
      <circle cx="0" cy="-6" r="2" fill="#f3e5f5" opacity="0.5"/>
      <circle cx="0" cy="-6" r="0.8" fill="#ffeb3b" opacity="0.7"/>
    </g>

    <!-- === BLÜTE 3: Gelbe Blume / Sonnenblume (rechts oben) === -->
    <g transform="translate(14, -4) rotate(12)">
      <!-- Blütenblätter als Sternform -->
      <path d="M0 -14 C-1.5 -11 -2 -7 0 -4 C2 -7 1.5 -11 0 -14Z" fill="url(#sunfl)"/>
      <path d="M0 -14 C-1.5 -11 -2 -7 0 -4 C2 -7 1.5 -11 0 -14Z" fill="url(#sunfl)" transform="rotate(45)"/>
      <path d="M0 -14 C-1.5 -11 -2 -7 0 -4 C2 -7 1.5 -11 0 -14Z" fill="url(#sunfl)" transform="rotate(90)"/>
      <path d="M0 -14 C-1.5 -11 -2 -7 0 -4 C2 -7 1.5 -11 0 -14Z" fill="url(#sunfl)" transform="rotate(135)"/>
      <path d="M0 -14 C-1.5 -11 -2 -7 0 -4 C2 -7 1.5 -11 0 -14Z" fill="url(#sunfl)" transform="rotate(180)"/>
      <path d="M0 -14 C-1.5 -11 -2 -7 0 -4 C2 -7 1.5 -11 0 -14Z" fill="url(#sunfl)" transform="rotate(225)"/>
      <path d="M0 -14 C-1.5 -11 -2 -7 0 -4 C2 -7 1.5 -11 0 -14Z" fill="url(#sunfl)" transform="rotate(270)"/>
      <path d="M0 -14 C-1.5 -11 -2 -7 0 -4 C2 -7 1.5 -11 0 -14Z" fill="url(#sunfl)" transform="rotate(315)"/>
      <!-- Dunklere Mitte -->
      <circle cx="0" cy="0" r="4.5" fill="#795548" opacity="0.85"/>
      <circle cx="0" cy="0" r="3.2" fill="#5d4037"/>
      <!-- Samen-Textur -->
      <circle cx="-1" cy="-1" r="0.5" fill="#8d6e63" opacity="0.6"/>
      <circle cx="1" cy="0.5" r="0.5" fill="#8d6e63" opacity="0.6"/>
      <circle cx="0" cy="1" r="0.5" fill="#8d6e63" opacity="0.5"/>
    </g>

    <!-- === BLÜTE 4: Kleine orange Knospe (links unten) === -->
    <g transform="translate(-10, 6) rotate(-30)">
      <path d="M0 -10 C-2.5 -8 -4 -5 -3 -2 C-2 0 -0.5 1 0 1 C0.5 1 2 0 3 -2 C4 -5 2.5 -8 0 -10Z" fill="url(#orange)" opacity="0.85"/>
      <path d="M0 -8 C-1 -6 -1.5 -4 -1 -2 C-0.5 -0.5 0 0 0 0 C0 0 0.5 -0.5 1 -2 C1.5 -4 1 -6 0 -8Z" fill="#ffe0b2" opacity="0.4"/>
    </g>

    <!-- === Kleine Knospen / Akzente === -->
    <circle cx="-18" cy="-14" r="2.8" fill="#ab47bc" opacity="0.45"/>
    <circle cx="20" cy="-16" r="2.2" fill="#f9a825" opacity="0.5"/>
    <circle cx="-6" cy="-22" r="1.8" fill="#ef5350" opacity="0.35"/>
    <circle cx="6" cy="-24" r="1.5" fill="#ce93d8" opacity="0.35"/>

    <!-- Bodenreflektion -->
    <ellipse cx="0" cy="44" rx="18" ry="2" fill="#2e7d32" opacity="0.04"/>
  </g>

  <!-- ===== TYPOGRAFIE ===== -->

  <!-- Vertikale Trennlinie -->
  <line x1="90" y1="18" x2="90" y2="92" stroke="#2e7d32" stroke-width="1.2" opacity="0.15"/>

  <!-- GÄRTNEREI – elegant gesperrt -->
  <text x="106" y="38"
        font-family="'Segoe UI', 'Helvetica Neue', 'SF Pro Display', Arial, sans-serif"
        font-size="16"
        font-weight="400"
        fill="#2e7d32"
        letter-spacing="5.5">GÄRTNEREI</text>

  <!-- EBER – kraftvoll, serif -->
  <text x="104" y="72"
        font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif"
        font-size="42"
        font-weight="700"
        fill="#1b5e20"
        letter-spacing="3">EBER</text>

  <!-- Akzentlinie unter GÄRTNEREI -->
  <line x1="106" y1="44" x2="260" y2="44" stroke="#4caf50" stroke-width="0.7" opacity="0.25"/>

  <!-- Slogan -->
  <text x="108" y="92"
        font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif"
        font-size="12"
        font-style="italic"
        fill="#6d4c41"
        letter-spacing="1"
        opacity="0.55">von da, wo es wächst</text>

  <!-- Dezenter Punkt nach Slogan -->
  <circle cx="253" cy="89" r="1.5" fill="#4caf50" opacity="0.25"/>
</svg>